<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1714" viewBox="0 0 1080 1714" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How a NearCash banknote is made, then redeemed</title>
<rect x="0.5" y="0.5" width="1079" height="1713" rx="14" fill="#ffffff" stroke="#dfe2e6"/>
<text x="540.0" y="40" font-size="21" font-weight="bold" fill="#161616" text-anchor="middle">How a banknote is made</text>
<rect x="26" y="60" width="190" height="44" rx="10" fill="#eef0f3"/>
<text x="121" y="88" font-size="16" font-weight="bold" fill="#161616" text-anchor="middle">Customer</text>
<rect x="235" y="60" width="190" height="44" rx="10" fill="#00EC97"/>
<text x="330" y="88" font-size="16" font-weight="bold" fill="#06281c" text-anchor="middle">ATM</text>
<rect x="445" y="60" width="190" height="44" rx="10" fill="#161616"/>
<text x="540" y="88" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bank</text>
<rect x="655" y="60" width="190" height="44" rx="10" fill="#eef0f3"/>
<text x="750" y="88" font-size="16" font-weight="bold" fill="#161616" text-anchor="middle">1Click · FAR</text>
<rect x="864" y="60" width="190" height="44" rx="10" fill="#eef0f3"/>
<text x="959" y="88" font-size="16" font-weight="bold" fill="#161616" text-anchor="middle">Issuer contract</text>
<rect x="16" y="116" width="1048" height="86" rx="8" fill="#f6f7f9"/>
<circle cx="46" cy="159" r="14" fill="#161616"/>
<text x="46" y="164" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">0</text>
<rect x="16" y="206" width="1048" height="64" rx="8" fill="#ffffff"/>
<circle cx="46" cy="238" r="14" fill="#161616"/>
<text x="46" y="243" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">1</text>
<rect x="16" y="274" width="1048" height="152" rx="8" fill="#f6f7f9"/>
<circle cx="46" cy="350" r="14" fill="#161616"/>
<text x="46" y="355" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">2</text>
<rect x="16" y="430" width="1048" height="122" rx="8" fill="#ffffff"/>
<circle cx="46" cy="491" r="14" fill="#161616"/>
<text x="46" y="496" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">3</text>
<rect x="16" y="556" width="1048" height="64" rx="8" fill="#f6f7f9"/>
<circle cx="46" cy="588" r="14" fill="#161616"/>
<text x="46" y="593" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">4</text>
<rect x="16" y="624" width="1048" height="86" rx="8" fill="#ffffff"/>
<circle cx="46" cy="667" r="14" fill="#161616"/>
<text x="46" y="672" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">5</text>
<rect x="16" y="714" width="1048" height="382" rx="8" fill="#f6f7f9"/>
<circle cx="46" cy="905" r="14" fill="#161616"/>
<text x="46" y="910" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">6</text>
<rect x="16" y="1100" width="1048" height="64" rx="8" fill="#ffffff"/>
<circle cx="46" cy="1132" r="14" fill="#161616"/>
<text x="46" y="1137" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">7</text>
<line x1="121" y1="104" x2="121" y2="1168" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="330" y1="104" x2="330" y2="1168" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="540" y1="104" x2="540" y2="1168" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="750" y1="104" x2="750" y2="1168" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="959" y1="104" x2="959" y2="1168" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect x="235" y="124" width="400" height="64" rx="8" fill="#e8fff6" stroke="#00b377" stroke-width="1.5"/>
<text x="435" y="145" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">Before any sale, at the bank&#x27;s factory (offline):</text>
<text x="435" y="161" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">each blank card&#x27;s chip makes a key C, and the bank&#x27;s</text>
<text x="435" y="177" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">production key signs it: the card&#x27;s birth certificate</text>
<text x="225.5" y="227" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">picks a banknote, the token</text>
<text x="225.5" y="243" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">to pay with, and a PIN</text>
<line x1="127" y1="254" x2="316" y2="254" stroke="#161616" stroke-width="2"/>
<path d="M326,254 l-13,-6 v12 z" fill="#161616"/>
<text x="435.0" y="295" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">asks for a quote</text>
<line x1="336" y1="306" x2="526" y2="306" stroke="#161616" stroke-width="2"/>
<path d="M536,306 l-13,-6 v12 z" fill="#161616"/>
<text x="645.0" y="331" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">a quote that pays</text>
<text x="645.0" y="347" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">the bank&#x27;s reserve on FAR</text>
<line x1="546" y1="358" x2="736" y2="358" stroke="#161616" stroke-width="2"/>
<path d="M746,358 l-13,-6 v12 z" fill="#161616"/>
<text x="435.0" y="383" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">the deposit address as a QR code:</text>
<text x="435.0" y="399" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">5 minutes to pay</text>
<line x1="534" y1="410" x2="344" y2="410" stroke="#161616" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M334,410 l13,-6 v12 z" fill="#161616"/>
<text x="435.5" y="451" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">pays the deposit address from their own wallet</text>
<text x="435.5" y="467" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">(in USDC, exactly the banknote&#x27;s value)</text>
<line x1="127" y1="478" x2="736" y2="478" stroke="#161616" stroke-width="2"/>
<path d="M746,478 l-13,-6 v12 z" fill="#161616"/>
<rect x="652" y="490" width="196" height="48" rx="8" fill="#e8fff6" stroke="#00b377" stroke-width="1.5"/>
<text x="750" y="511" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">converts it into the</text>
<text x="750" y="527" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">bank&#x27;s reserve, on FAR</text>
<text x="645.0" y="577" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">SUCCESS: the bank reads it</text>
<text x="645.0" y="593" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">from 1Click, not from the ATM</text>
<line x1="744" y1="604" x2="554" y2="604" stroke="#161616" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M544,604 l13,-6 v12 z" fill="#161616"/>
<rect x="195" y="632" width="270" height="64" rx="8" fill="#e8fff6" stroke="#00b377" stroke-width="1.5"/>
<text x="330" y="653" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">pushes a blank card into the reader:</text>
<text x="330" y="669" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">its chip makes its own keys, A and F,</text>
<text x="330" y="685" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">and signs them with C</text>
<text x="435.0" y="735" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">the card&#x27;s keys and its</text>
<text x="435.0" y="751" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">birth certificate</text>
<line x1="336" y1="762" x2="526" y2="762" stroke="#161616" stroke-width="2"/>
<path d="M536,762 l-13,-6 v12 z" fill="#161616"/>
<rect x="425" y="774" width="230" height="64" rx="8" fill="#e8fff6" stroke="#00b377" stroke-width="1.5"/>
<text x="540" y="795" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">checks the birth certificate:</text>
<text x="540" y="811" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">a card the bank didn&#x27;t make</text>
<text x="540" y="827" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">is refused here</text>
<text x="645.0" y="866" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">moves the value from the reserve</text>
<text x="645.0" y="882" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">to the card&#x27;s own account</text>
<line x1="546" y1="893" x2="736" y2="893" stroke="#161616" stroke-width="2"/>
<path d="M746,893 l-13,-6 v12 z" fill="#161616"/>
<text x="749.5" y="918" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">asks for the certificate</text>
<line x1="546" y1="929" x2="945" y2="929" stroke="#161616" stroke-width="2"/>
<path d="M955,929 l-13,-6 v12 z" fill="#161616"/>
<rect x="864" y="941" width="190" height="64" rx="8" fill="#e8fff6" stroke="#00b377" stroke-width="1.5"/>
<text x="959" y="962" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">checks the birth again;</text>
<text x="959" y="978" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">the NEAR MPC network</text>
<text x="959" y="994" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">signs the certificate</text>
<text x="749.5" y="1033" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">the signed certificate</text>
<line x1="953" y1="1044" x2="554" y2="1044" stroke="#161616" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M544,1044 l13,-6 v12 z" fill="#161616"/>
<text x="435.0" y="1069" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">the signed certificate</text>
<line x1="534" y1="1080" x2="344" y2="1080" stroke="#161616" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M334,1080 l13,-6 v12 z" fill="#161616"/>
<text x="225.5" y="1121" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">writes the certificate and the PIN,</text>
<text x="225.5" y="1137" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">checks the card, hands it out</text>
<line x1="324" y1="1148" x2="135" y2="1148" stroke="#161616" stroke-width="2"/>
<path d="M125,1148 l13,-6 v12 z" fill="#161616"/>
<rect x="16" y="1178" width="1048" height="62" rx="10" fill="#161616"/>
<text x="540.0" y="1204" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">From here on the bank is no longer needed.</text>
<text x="540.0" y="1226" font-size="13" font-weight="normal" fill="#ffffff" text-anchor="middle">The banknote goes hand to hand, offline: any phone can check it, and its holder redeems it on FAR with the PIN.</text>
<text x="540.0" y="1294" font-size="21" font-weight="bold" fill="#161616" text-anchor="middle">Redeem, whenever the holder wants</text>
<rect x="26" y="1314" width="242" height="44" rx="10" fill="#eef0f3"/>
<text x="147" y="1342" font-size="16" font-weight="bold" fill="#161616" text-anchor="middle">Holder</text>
<rect x="288" y="1314" width="242" height="44" rx="10" fill="#00EC97"/>
<text x="409" y="1342" font-size="16" font-weight="bold" fill="#06281c" text-anchor="middle">Wallet app</text>
<rect x="550" y="1314" width="242" height="44" rx="10" fill="#161616"/>
<text x="671" y="1342" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Banknote</text>
<rect x="812" y="1314" width="242" height="44" rx="10" fill="#eef0f3"/>
<text x="933" y="1342" font-size="16" font-weight="bold" fill="#161616" text-anchor="middle">1Click · FAR</text>
<rect x="16" y="1370" width="1048" height="64" rx="8" fill="#f6f7f9"/>
<circle cx="46" cy="1402" r="14" fill="#161616"/>
<text x="46" y="1407" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">8</text>
<rect x="16" y="1438" width="1048" height="116" rx="8" fill="#ffffff"/>
<circle cx="46" cy="1496" r="14" fill="#161616"/>
<text x="46" y="1501" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">9</text>
<rect x="16" y="1558" width="1048" height="136" rx="8" fill="#f6f7f9"/>
<circle cx="46" cy="1626" r="14" fill="#161616"/>
<text x="46" y="1631" font-size="15" font-weight="bold" fill="#00EC97" text-anchor="middle">10</text>
<line x1="147" y1="1358" x2="147" y2="1698" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="409" y1="1358" x2="409" y2="1698" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="671" y1="1358" x2="671" y2="1698" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<line x1="933" y1="1358" x2="933" y2="1698" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="278.0" y="1391" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">chooses where the money goes</text>
<text x="278.0" y="1407" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">(token, chain, address) and types the PIN</text>
<line x1="153" y1="1418" x2="395" y2="1418" stroke="#161616" stroke-width="2"/>
<path d="M405,1418 l-13,-6 v12 z" fill="#161616"/>
<text x="540.0" y="1459" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">asks the card to sign</text>
<text x="540.0" y="1475" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">the withdrawal, with the PIN</text>
<line x1="415" y1="1486" x2="657" y2="1486" stroke="#161616" stroke-width="2"/>
<path d="M667,1486 l-13,-6 v12 z" fill="#161616"/>
<text x="540.0" y="1511" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">its one signature: from now</text>
<text x="540.0" y="1527" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">on the card is spent, for good</text>
<line x1="665" y1="1538" x2="423" y2="1538" stroke="#161616" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M413,1538 l13,-6 v12 z" fill="#161616"/>
<text x="671.0" y="1579" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">submits the signed withdrawal</text>
<line x1="415" y1="1590" x2="919" y2="1590" stroke="#161616" stroke-width="2"/>
<path d="M929,1590 l-13,-6 v12 z" fill="#161616"/>
<text x="540.0" y="1615" font-size="13" font-weight="normal" fill="#161616" text-anchor="middle">the card&#x27;s money reaches the holder&#x27;s own wallet</text>
<line x1="927" y1="1626" x2="161" y2="1626" stroke="#161616" stroke-width="2"/>
<path d="M151,1626 l13,-6 v12 z" fill="#161616"/>
<text x="671.0" y="1651" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">if the delivery fails: a refund to the holder&#x27;s</text>
<text x="671.0" y="1667" font-size="13" font-weight="normal" fill="#5b616b" text-anchor="middle">passkey account inside FAR, never to the card</text>
<line x1="927" y1="1678" x2="423" y2="1678" stroke="#161616" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M413,1678 l13,-6 v12 z" fill="#161616"/>
</svg>
